databases:
  - name: ixlosbek-portfolio-db
    databaseName: ixlosbek_portfolio
    user: ixlosbek
    plan: free
    region: frankfurt

services:
  - type: web
    name: ixlosbek-portfolio
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ixlosbek-portfolio-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
